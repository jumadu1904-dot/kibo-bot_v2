# Render Blueprint — describes the service so a future "New +" > "Blueprint"
# deploy on Render can pick it up. Committing this file does NOT deploy
# anything by itself; nothing happens until it's connected on render.com.
services:
  - type: web
    name: kibo-bot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn kibo.main:app --app-dir src --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: BOT_MODE
        value: webhook
      - key: TELEGRAM_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false # set to https://<your-service>.onrender.com once created
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Neon Postgres (free tier): Render's free plan has no persistent disk,
      # so SQLite can't be used in production. Create a project at neon.tech,
      # copy its connection string and adapt it to the asyncpg driver, e.g.
      # postgresql+asyncpg://<user>:<password>@<host>/<db>?ssl=require
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: STATE_SECRET
        generateValue: true
