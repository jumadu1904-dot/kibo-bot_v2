[project]
name = "kibo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # No [job-queue] extra: scheduling is driven by an external cron hitting
    # GET /check-reminders, not by an in-process timer (see docs/ARCHITECTURE.md).
    "python-telegram-bot>=21.6,<22",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",     # production DB: Postgres (Neon free tier)
    "aiosqlite>=0.20",   # only for local dev/tests, see docs/ARCHITECTURE.md
    "alembic>=1.13",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kibo = ["i18n/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
